<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>My card · Poseidon Solutions</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Instrument+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="site.css">
</head>
<body>
<div class="sea" aria-hidden="true"></div>
<div class="wrap">
  <div class="brand">
    <img src="logo.jpg" alt="">
    <h1>Poseidon Solutions</h1>
    <p id="whoami">Loading…</p>
  </div>

  <!-- Share block: shown once a profile exists -->
  <div class="card" id="share" hidden>
    <h2>Your card</h2>
    <p class="muted">Save the QR to your phone's Photos. Customers scan it and your card opens with the review button.</p>
    <div class="qr" id="qr"></div>
    <div class="linkbox">
      <input id="link" type="text" readonly>
      <button class="btn" id="copy" type="button">Copy</button>
    </div>
    <div class="btns">
      <a class="btn gold" id="download" href="#" download="my-poseidon-qr.png">Download QR</a>
      <a class="btn" id="open" href="#" target="_blank" rel="noopener">Open my card</a>
    </div>
  </div>

  <!-- Profile form: create or edit -->
  <div class="card" id="profile" hidden>
    <h2 id="form-title">Set up your card</h2>
    <form id="form" novalidate style="display:grid;gap:12px">
      <div class="avatar-edit">
        <img id="preview" src="logo.jpg" alt="">
        <div style="display:grid;gap:6px">
          <label class="btn" for="photo" style="cursor:pointer">Choose photo</label>
          <input id="photo" type="file" accept="image/*" hidden>
          <button class="btn quiet" id="clear-photo" type="button">Use company logo</button>
        </div>
      </div>
      <label>Full name <input id="name" type="text" autocomplete="name" required maxlength="80"></label>
      <label>Title <input id="role" type="text" placeholder="Technician, Sales Rep, Installer…" maxlength="80"></label>
      <div class="row">
        <label>Phone <input id="phone" type="tel" autocomplete="tel" placeholder="(719) 555-0100" maxlength="30"></label>
        <label>Email on card <input id="email" type="email" autocomplete="email" maxlength="120"></label>
      </div>
      <label id="slug-wrap">Card link ending <input id="slug" type="text" placeholder="first-last" maxlength="40" pattern="[a-z0-9-]{3,40}">
        <span class="muted" id="slug-preview"></span></label>
      <div class="notice err" id="err" hidden></div>
      <div class="notice ok" id="ok" hidden></div>
      <button class="btn primary" id="save" type="submit">Save card</button>
    </form>
  </div>

  <!-- Admin -->
  <div class="card" id="admin" hidden>
    <h2>Team</h2>
    <label>Invite code for new sign-ups
      <div class="linkbox"><input id="invite" type="text" maxlength="40"><button class="btn" id="save-invite" type="button">Save</button></div>
    </label>
    <div class="list" id="people"></div>
  </div>

  <div class="btns">
    <a class="btn" href="index.html">Company card</a>
    <button class="btn quiet" id="signout" type="button">Sign out</button>
  </div>
  <p class="foot">Purity from the Gods</p>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="company.js"></script>
<script src="firebase-config.js"></script>
<script type="module">
const $ = (id) => document.getElementById(id);
const toast = (m) => { const t = $("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200); };
const showErr = (m) => { $("err").textContent = m; $("err").hidden = !m; };
const showOk  = (m) => { $("ok").textContent = m; $("ok").hidden = !m; };
const slugify = (s) => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40);
const cardUrl = (slug) => `${window.COMPANY.baseUrl}?u=${slug}`;

if (!window.FIREBASE_READY()) { location.replace("join.html"); await new Promise(() => {}); }

const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js");
const { getAuth, onAuthStateChanged, signOut } = await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js");
const { getFirestore, doc, getDoc, setDoc, updateDoc, collection, getDocs, serverTimestamp } =
  await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js");
const app = initializeApp(window.FIREBASE_CONFIG);
const auth = getAuth(app), db = getFirestore(app);

let user = null, profile = null, photoData = "";

$("signout").onclick = async () => { await signOut(auth); location.replace("join.html"); };

onAuthStateChanged(auth, async (u) => {
  if (!u) { location.replace("join.html"); return; }
  user = u;
  $("whoami").textContent = u.email;
  await load();
});

async function load() {
  const link = await getDoc(doc(db, "users", user.uid));
  if (link.exists()) {
    const snap = await getDoc(doc(db, "profiles", link.data().slug));
    if (snap.exists()) profile = snap.data();
  }
  if (profile) {
    fill(profile); showShare(profile.slug);
    $("form-title").textContent = "Edit your card";
    $("slug").disabled = true;
    $("save").textContent = "Save changes";
  } else {
    $("email").value = user.email || "";
    $("form-title").textContent = "Set up your card";
  }
  $("profile").hidden = false;
  await loadAdmin();
}

function fill(p) {
  $("name").value = p.name || ""; $("role").value = p.role || ""; $("phone").value = p.phone || "";
  $("email").value = p.email || ""; $("slug").value = p.slug || "";
  photoData = p.photo || ""; $("preview").src = photoData || "logo.jpg";
  $("slug-preview").textContent = cardUrl(p.slug || "");
}

function showShare(slug) {
  $("share").hidden = false;
  const url = cardUrl(slug);
  $("link").value = url; $("open").href = url;
  $("qr").innerHTML = "";
  new QRCode($("qr"), { text: url, width: 640, height: 640, colorDark: "#0d2242", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.H });
  setTimeout(() => {
    const c = $("qr").querySelector("canvas"); if (!c) return;
    // trident logo in the center (H error correction tolerates the covered area)
    const logo = new Image(); logo.src = "logo.jpg";
    logo.onload = () => {
      const ctx = c.getContext("2d"), w = c.width, tile = Math.round(w * 0.24), inner = Math.round(tile * 0.86), x = (w - tile) / 2;
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.roundRect(x, x, tile, tile, tile / 6); ctx.fill();
      ctx.drawImage(logo, x + (tile - inner) / 2, x + (tile - inner) / 2, inner, inner);
      const img = $("qr").querySelector("img"); if (img) img.src = c.toDataURL("image/png");
      $("download").href = c.toDataURL("image/png");
    };
  }, 80);
  $("download").download = `${slug}-poseidon-qr.png`;
}
$("copy").onclick = async () => { try { await navigator.clipboard.writeText($("link").value); toast("Link copied"); } catch { $("link").select(); toast("Select and copy"); } };

$("name").addEventListener("input", () => { if (!$("slug").disabled && !$("slug").dataset.touched) { $("slug").value = slugify($("name").value); $("slug-preview").textContent = cardUrl($("slug").value); } });
$("slug").addEventListener("input", () => { $("slug").dataset.touched = "1"; $("slug").value = slugify($("slug").value); $("slug-preview").textContent = cardUrl($("slug").value); });

$("photo").addEventListener("change", async (ev) => {
  const file = ev.target.files[0]; if (!file) return;
  try { photoData = await squareJpeg(file, 360); $("preview").src = photoData; }
  catch (e) { showErr("Couldn't read that image. Try a JPG or PNG."); }
});
$("clear-photo").onclick = () => { photoData = ""; $("preview").src = "logo.jpg"; $("photo").value = ""; };

function squareJpeg(file, size) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(img.width, img.height);
      const c = document.createElement("canvas"); c.width = c.height = size;
      c.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
      let q = 0.85, out = c.toDataURL("image/jpeg", q);
      while (out.length > 150000 && q > 0.4) { q -= 0.1; out = c.toDataURL("image/jpeg", q); }
      URL.revokeObjectURL(img.src); resolve(out);
    };
    img.onerror = reject; img.src = URL.createObjectURL(file);
  });
}

$("form").addEventListener("submit", async (ev) => {
  ev.preventDefault(); showErr(""); showOk("");
  const name = $("name").value.trim(), role = $("role").value.trim(), phone = $("phone").value.trim(), email = $("email").value.trim();
  const slug = profile ? profile.slug : slugify($("slug").value || name);
  if (name.length < 2) { showErr("Enter your full name."); return; }
  if (!/^[a-z0-9-]{3,40}$/.test(slug)) { showErr("Card link ending must be 3–40 letters, numbers or dashes."); return; }
  $("save").disabled = true;
  const data = { uid: user.uid, slug, name, role, phone, email, photo: photoData, active: profile ? profile.active !== false : true, updatedAt: serverTimestamp() };
  try {
    if (profile) {
      await updateDoc(doc(db, "profiles", slug), data);
      profile = { ...profile, ...data };
      showOk("Saved. Your card is updated."); showShare(slug);
    } else {
      const taken = await getDoc(doc(db, "profiles", slug));
      if (taken.exists()) { showErr("That link ending is taken. Try adding a number or your middle initial."); $("save").disabled = false; return; }
      let inviteCode = ""; try { inviteCode = sessionStorage.getItem("inviteCode") || ""; } catch {}
      if (!inviteCode) inviteCode = window.prompt("Enter the team invite code") || "";
      await setDoc(doc(db, "profiles", slug), { ...data, inviteCode, createdAt: serverTimestamp() });
      await setDoc(doc(db, "users", user.uid), { slug, email: user.email, createdAt: serverTimestamp() });
      profile = data;
      $("slug").disabled = true; $("form-title").textContent = "Edit your card"; $("save").textContent = "Save changes";
      showOk("Your card is live."); showShare(slug);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
  } catch (e) {
    console.error(e);
    showErr(e.code === "permission-denied" ? "Couldn't save. Check the invite code with your manager, or the link ending may be taken." : e.message);
  }
  $("save").disabled = false;
});

async function loadAdmin() {
  const adm = await getDoc(doc(db, "admins", user.uid)).catch(() => null);
  if (!adm || !adm.exists()) return;
  $("admin").hidden = false;
  const settings = await getDoc(doc(db, "settings", "company")).catch(() => null);
  $("invite").value = settings && settings.exists() ? (settings.data().inviteCode || "") : "";
  $("save-invite").onclick = async () => {
    try { await setDoc(doc(db, "settings", "company"), { inviteCode: $("invite").value.trim() }, { merge: true }); toast("Invite code saved"); }
    catch (e) { toast("Couldn't save invite code"); }
  };
  const all = await getDocs(collection(db, "profiles"));
  $("people").innerHTML = "";
  all.forEach((d) => {
    const p = d.data();
    const row = document.createElement("div"); row.className = "person" + (p.active === false ? " off" : "");
    row.innerHTML = `<img alt=""><div><div class="n"></div><div class="r"></div></div><button class="btn quiet" type="button"></button>`;
    row.querySelector("img").src = p.photo || "logo.jpg";
    row.querySelector(".n").textContent = p.name;
    row.querySelector(".r").textContent = `${p.role || ""} · ${p.email || ""} · ?u=${p.slug}`;
    const b = row.querySelector("button"); b.textContent = p.active === false ? "Activate" : "Deactivate";
    b.onclick = async () => { await updateDoc(doc(db, "profiles", d.id), { active: p.active === false }); toast(p.active === false ? "Card activated" : "Card deactivated"); loadAdmin(); };
    $("people").appendChild(row);
  });
}
</script>
</body>
</html>
