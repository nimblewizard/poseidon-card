<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<!--ARTIFACT-START-->
<title>Poseidon Solutions Card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a frosted white card floating over the underwater photo; navy from the trident, gold for the review call. Single look, committed to the ocean. */
:root {
  --ground: #0f6f8f;
  --card: rgba(255,255,255,.93);
  --band: #0d2242;
  --band-2: #16355f;
  --ink: #0f1d33;
  --ink-soft: #52627a;
  --line: #d4dde6;
  --accent: #1b4f8a;
  --accent-ink: #ffffff;
  --review: #f2b632;
  --review-ink: #1f1500;
  --display: "Cinzel", "Trajan Pro", Georgia, serif;
  --body: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--ground);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
  padding-inline: 16px;
  padding-block: 24px 40px;
  min-height: 100%;
}
.sea {
  position: fixed; inset: 0; z-index: -1;
  background: var(--ground) url("bg.png") center / cover no-repeat;
}
.wrap { max-width: 440px; margin: 0 auto; display: grid; gap: 16px; }

.card {
  background: var(--card);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 16px 40px rgba(2,20,45,.35);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.band {
  background: linear-gradient(160deg, var(--band), var(--band-2));
  color: #fff;
  padding: 26px 24px 58px;
  text-align: center;
}
.band .company {
  font-family: var(--display);
  font-weight: 700;
  font-size: 1.35rem;
  letter-spacing: .08em;
  text-transform: uppercase;
  margin: 0;
  line-height: 1.2;
}
.band .tagline { margin: 8px auto 0; font-size: .92rem; opacity: .85; max-width: 34ch; }
.avatar {
  width: 104px; height: 104px; border-radius: 50%;
  background: #fff; display: block; object-fit: cover;
  border: 4px solid #fff;
  margin: -52px auto 0;
  box-shadow: 0 6px 18px rgba(2,20,45,.25);
}
.who { padding: 12px 24px 8px; text-align: center; }
.who h1 {
  font-family: var(--display);
  font-size: 1.6rem;
  font-weight: 600;
  line-height: 1.15;
  margin: 0;
  text-wrap: balance;
}
.who .role { margin: 4px 0 0; color: var(--ink-soft); font-weight: 500; }

.actions {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  padding: 16px 24px 8px;
}
.actions a {
  display: grid; gap: 6px; justify-items: center;
  text-decoration: none; color: var(--ink);
  font-size: .78rem; font-weight: 600;
  padding: 12px 4px; border-radius: 14px;
  border: 1px solid var(--line);
  background: #fff;
}
.actions a:hover, .actions a:focus-visible { border-color: var(--accent); outline: none; }
.actions a:focus-visible { box-shadow: 0 0 0 3px rgba(27,79,138,.35); }
.actions svg { width: 22px; height: 22px; fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.details { padding: 8px 24px 20px; display: grid; gap: 10px; }
.detail { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; min-width: 0; }
.detail .label { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.detail .value { font-weight: 500; word-break: break-word; }
.detail .value a { color: var(--ink); text-decoration: none; }
.detail .value a:hover { text-decoration: underline; }
.copy {
  font: inherit; font-size: .78rem; font-weight: 600;
  border: 1px solid var(--line); background: transparent; color: var(--ink-soft);
  border-radius: 999px; padding: 4px 10px; cursor: pointer;
}
.copy:hover, .copy:focus-visible { color: var(--accent); border-color: var(--accent); outline: none; }

.services { padding: 0 24px 20px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.services span { font-size: .75rem; font-weight: 500; color: var(--accent); background: rgba(27,79,138,.08); border-radius: 999px; padding: 4px 10px; }

.save {
  margin: 0 24px 24px;
  display: flex; justify-content: center; align-items: center; gap: 8px;
  padding: 14px; border-radius: 14px;
  background: var(--accent); color: var(--accent-ink);
  font: inherit; font-weight: 600; font-size: 1rem;
  text-decoration: none; border: 0; cursor: pointer; width: calc(100% - 48px);
}
.save:focus-visible { outline: 3px solid rgba(27,79,138,.45); outline-offset: 2px; }

.review {
  display: block; text-decoration: none;
  background: var(--review); color: var(--review-ink);
  border-radius: 20px; padding: 22px 24px;
  box-shadow: 0 16px 40px rgba(2,20,45,.35);
}
.review .stars { font-size: 1.4rem; letter-spacing: .1em; line-height: 1; }
.review h2 { font-family: var(--display); font-size: 1.3rem; margin: 8px 0 4px; line-height: 1.2; text-wrap: balance; }
.review p { margin: 0; opacity: .85; }
.review .go { display: inline-block; margin-top: 12px; font-weight: 600; border-bottom: 2px solid currentColor; }
.review:focus-visible { outline: 3px solid var(--review-ink); outline-offset: 3px; }

.socials { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.socials a {
  color: var(--ink); text-decoration: none; font-size: .85rem; font-weight: 500;
  padding: 8px 14px; border-radius: 999px; background: var(--card);
}
.socials a:hover { color: var(--accent); }

.foot { text-align: center; color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.4); font-size: .82rem; font-family: var(--display); letter-spacing: .06em; }
.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--band); color: #fff; padding: 10px 16px; border-radius: 999px;
  font-size: .85rem; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .2s;
}
.toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
@media (max-width: 360px) { .actions { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<div class="sea" aria-hidden="true"></div>
<div class="wrap">
  <section class="card" aria-label="Business card">
    <div class="band">
      <p class="company" id="company"></p>
      <p class="tagline" id="tagline"></p>
    </div>
    <img class="avatar" id="avatar" alt="">
    <div class="who">
      <h1 id="name"></h1>
      <p class="role" id="role"></p>
    </div>
    <nav class="actions" aria-label="Quick actions">
      <a id="a-call" href="#"><svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.9.6 2.8.7a2 2 0 0 1 1.8 2z"/></svg>Call</a>
      <a id="a-text" href="#"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Text</a>
      <a id="a-email" href="#"><svg viewBox="0 0 24 24"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path d="m22 6-10 7L2 6"/></svg>Email</a>
      <a id="a-map" href="#" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>Directions</a>
    </nav>
    <div class="details" id="details"></div>
    <div class="services" id="services"></div>
    <button class="save" id="save" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
      Save to contacts
    </button>
  </section>

  <a class="review" id="review" href="#" target="_blank" rel="noopener">
    <div class="stars" aria-hidden="true">★★★★★</div>
    <h2 id="review-title"></h2>
    <p id="review-text"></p>
    <span class="go">Leave a Google review →</span>
  </a>

  <nav class="socials" id="socials" aria-label="Links"></nav>
  <p class="foot" id="foot"></p>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============================================================
   EDIT THIS BLOCK. Everything on the page is built from it.
   ============================================================ */
const CARD = {
  company:  "Poseidon Solutions",
  tagline:  "Water treatment, purification and plumbing for Colorado homes.",
  name:     "Chris Lucia",
  role:     "Technician",
  photo:    "logo.jpg",          // swap for a headshot (e.g. "chris.jpg") if you want a face here
  phone:    "+17196601199",
  phoneDisplay: "(719) 660-1199",
  email:    "kenneth@waterbyposeidon.com",
  website:  "https://waterbyposeidon.com",
  websiteDisplay: "waterbyposeidon.com",
  address:  "6058 Hollow Tree Point, Colorado Springs, CO 80918",
  mapsUrl:  "https://www.google.com/maps/dir/?api=1&destination=6058+Hollow+Tree+Point,+Colorado+Springs,+CO+80918",
  hours:    "Mon–Fri 11am–8pm · Sat 10am–4pm · Sun closed",
  services: ["Whole-home water systems", "RO drinking water", "Water conditioners", "Iron & manganese filters", "Tankless water heaters", "Plumbing"],

  reviewUrl:   "https://share.google/RW1H3cUh6bPFLKHyQ",
  reviewTitle: "How did we do today?",
  reviewText:  "A quick Google review takes 30 seconds and helps a local Colorado Springs business more than you'd think.",

  socials: [
    { label: "Facebook",  url: "https://www.facebook.com/PoseidonHomeSolutions/" },
    { label: "Instagram", url: "https://www.instagram.com/poseidonsolutions/" },
    { label: "Website",   url: "https://waterbyposeidon.com" },
  ],
  footer: "Purity from the Gods",
};
/* ============================================================ */

const $ = (id) => document.getElementById(id);
const toast = (msg) => { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 1800); };

$("company").textContent = CARD.company;
$("tagline").textContent = CARD.tagline;
$("name").textContent = CARD.name;
$("role").textContent = CARD.role;
$("avatar").src = CARD.photo;
$("avatar").alt = CARD.company + " logo";
document.title = `${CARD.name} · ${CARD.company}`;

$("a-call").href  = `tel:${CARD.phone}`;
$("a-text").href  = `sms:${CARD.phone}`;
$("a-email").href = `mailto:${CARD.email}`;
$("a-map").href   = CARD.mapsUrl;

const rows = [
  ["Phone",   CARD.phoneDisplay, `tel:${CARD.phone}`, CARD.phoneDisplay],
  ["Email",   CARD.email, `mailto:${CARD.email}`, CARD.email],
  ["Website", CARD.websiteDisplay, CARD.website, CARD.website],
  ["Address", CARD.address, CARD.mapsUrl, CARD.address],
  ["Hours",   CARD.hours, null, null],
];
for (const [label, value, href, copyText] of rows) {
  if (!value) continue;
  const row = document.createElement("div"); row.className = "detail";
  const left = document.createElement("div");
  left.innerHTML = `<div class="label"></div><div class="value"></div>`;
  left.querySelector(".label").textContent = label;
  const v = left.querySelector(".value");
  if (href) { const a = document.createElement("a"); a.href = href; a.textContent = value; if (href.startsWith("http")) { a.target = "_blank"; a.rel = "noopener"; } v.appendChild(a); }
  else v.textContent = value;
  row.appendChild(left);
  if (copyText) {
    const b = document.createElement("button"); b.type = "button"; b.className = "copy"; b.textContent = "Copy";
    b.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(copyText); toast(`${label} copied`); }
      catch { const r = document.createRange(); r.selectNodeContents(v); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Select and copy"); }
    });
    row.appendChild(b);
  }
  $("details").appendChild(row);
}

for (const s of CARD.services || []) { const el = document.createElement("span"); el.textContent = s; $("services").appendChild(el); }

$("review").href = CARD.reviewUrl;
$("review-title").textContent = CARD.reviewTitle;
$("review-text").textContent = CARD.reviewText;

for (const s of CARD.socials || []) {
  const a = document.createElement("a"); a.href = s.url; a.textContent = s.label; a.target = "_blank"; a.rel = "noopener";
  $("socials").appendChild(a);
}
$("foot").textContent = CARD.footer || "";

// vCard download (works when self-hosted; falls back to copying the contact text)
function vcard() {
  const esc = (s) => String(s || "").replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/,/g, "\\,").replace(/;/g, "\;");
  const parts = CARD.name.trim().split(/\s+/); const last = parts.length > 1 ? parts.pop() : ""; const first = parts.join(" ");
  return [
    "BEGIN:VCARD", "VERSION:3.0",
    `N:${esc(last)};${esc(first)};;;`, `FN:${esc(CARD.name)}`,
    `ORG:${esc(CARD.company)}`, `TITLE:${esc(CARD.role)}`,
    `TEL;TYPE=CELL,VOICE:${CARD.phone}`, `EMAIL;TYPE=INTERNET:${CARD.email}`,
    `URL:${CARD.website}`, `ADR;TYPE=WORK:;;${esc(CARD.address)};;;;`,
    `NOTE:${esc(CARD.tagline)}`, "END:VCARD", ""
  ].join("\r\n");
}
$("save").addEventListener("click", async () => {
  const text = vcard();
  try {
    const url = URL.createObjectURL(new Blob([text], { type: "text/vcard;charset=utf-8" }));
    const a = document.createElement("a"); a.href = url; a.download = `${CARD.name.replace(/\s+/g, "_")}.vcf`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast("Contact card downloading");
  } catch {
    try { await navigator.clipboard.writeText(`${CARD.name}\n${CARD.company}\n${CARD.phoneDisplay}\n${CARD.email}\n${CARD.website}`); toast("Contact details copied"); }
    catch { toast("Use the Copy buttons above"); }
  }
});
</script>
</body>
</html>
